name = "daemons"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

assets = { directory = "../frontend/dist", binding = "ASSETS" }

[[d1_databases]]
binding = "DB"
database_name = "daemons-db"
database_id = "YOUR_D1_DATABASE_ID"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "YOUR_RATE_LIMIT_KV_ID"

[[kv_namespaces]]
binding = "CIRCUIT_BREAKER"
id = "YOUR_CIRCUIT_BREAKER_KV_ID"

[triggers]
crons = ["*/2 * * * *"]

[vars]
# Non-secret vars (ANTHROPIC_API_KEY is a secret, set via wrangler secret put)
